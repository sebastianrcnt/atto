name: ci
# Not on every push while development is this busy: once a night (and by
# hand) the tests run on all three systems and, when they pass, edge is
# built from main. Releases (tags) have their own workflow.
on:
  schedule:
    - cron: '0 18 * * *'  # 03:00 KST
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - '**.md'
      - LICENSE
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      # -race only on Linux: it is the slow part, and the race detector finds
      # the same data races on every OS.
      - if: runner.os == 'Linux'
        run: go test -race ./...
      - if: runner.os != 'Linux'
        run: go test ./...
      - run: go build ./cmd/atto
      - if: runner.os == 'Linux'
        run: go vet -tags noext ./... && go test -race -tags noext ./... && go build -tags noext ./cmd/atto

  # Everything below runs only for main (nightly or by hand). The binaries
  # build in parallel with the tests; only publishing waits for the tests.
  version:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # git describe needs the tags
      - id: v
        # v<next>-dev.<N>+<sha7>: the last v* tag with its patch bumped, N
        # commits after it. For v0.0.2 plus 14 commits: v0.0.3-dev.14+abc1234.
        # Computed once so every build and the release agree on it.
        run: |
          desc=$(git describe --tags --long --abbrev=7 --match 'v[0-9]*.[0-9]*.[0-9]*' --exclude 'v*-*' 2>/dev/null \
            || echo "v0.0.0-$(git rev-list --count HEAD)-g$(git rev-parse --short=7 HEAD)")
          sha=${desc##*-g}
          rest=${desc%-g*}
          n=${rest##*-}
          tag=${rest%-*}
          IFS=. read -r major minor patch <<< "${tag#v}"
          echo "version=v$major.$minor.$((patch + 1))-dev.$n+$sha" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - darwin/amd64
          - darwin/arm64
          - linux/amd64
          - linux/arm64
          - windows/amd64
          - windows/arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          os=${TARGET%/*} arch=${TARGET#*/}
          for variant in full slim; do
            prefix=atto tags=
            [ "$variant" = slim ] && prefix=atto-slim tags=noext
            out=${prefix}_${os}_${arch}
            [ "$os" = windows ] && out=$out.exe
            echo "Building $VERSION for $TARGET"
            mkdir -p dist
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -tags "$tags" \
              -ldflags "-s -w -X github.com/sebastianrcnt/atto/update.Version=${VERSION} -X github.com/sebastianrcnt/atto/update.Channel=edge" \
              -o "dist/$out" ./cmd/atto
          done
      - uses: actions/upload-artifact@v4
        with:
          # Artifact names cannot contain "/", so number them.
          name: atto-${{ strategy.job-index }}
          path: dist/atto*_*
          if-no-files-found: error
          retention-days: 1

  # Every push to main becomes the rolling "edge" prerelease, once the tests
  # pass on all three systems. Tagged releases are release.yml's job.
  edge:
    needs: [test, build, version]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write     # update the edge release and move its tag
      id-token: write     # sign the build provenance
      attestations: write
    # Two quick pushes must not publish at the same time; the later one waits.
    concurrency:
      group: edge-release
      cancel-in-progress: false
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # No checkout in this job, so gh can't infer the repository.
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: atto-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum atto*_* > checksums.txt
          cat checksums.txt
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/atto*_*
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        # Update the release in place; never delete it. A delete+create leaves
        # a window where releases/tags/edge and releases/download/edge/* are
        # 404, which breaks install scripts, "atto update" and "atto channel
        # edge". Asset names are fixed, so --clobber replaces every old asset.
        # --prerelease and --latest=false keep it out of releases/latest, so
        # stable installs and "atto update" never see it.
        run: |
          set -euo pipefail
          printf 'Commit: %s/%s/commit/%s\n\nUnstable build of main, replaced on every push. Install with `ATTO_CHANNEL=edge`.\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_SHA" > notes.md
          if gh release view edge >/dev/null 2>&1; then
            # 1. Move the tag to this commit (force-update the ref; create it
            #    if the release somehow exists without its tag).
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/edge" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null \
              || gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
                -f ref=refs/tags/edge -f sha="$GITHUB_SHA" >/dev/null
            # 2. Binaries first, checksums.txt last and immediately after, so
            #    the window where a new binary sits next to the old
            #    checksums.txt (installers fail with a checksum error, never
            #    install a bad binary) is only the gap between two uploads.
            gh release upload edge dist/atto*_* --clobber
            gh release upload edge dist/checksums.txt --clobber
            # 3. Title and notes last: they name the commit, so they flip
            #    only once the assets match it.
            gh release edit edge \
              --title "$VERSION" \
              --notes-file notes.md \
              --prerelease \
              --latest=false
          else
            gh release create edge dist/* \
              --title "$VERSION" \
              --notes-file notes.md \
              --target "$GITHUB_SHA" \
              --prerelease \
              --latest=false
          fi
