<!doctype html>
<meta charset="utf-8">
<title>atto WebSocket example</title>
<style>
body { font: 16px system-ui; max-width: 900px; margin: 2em auto; padding: 0 1em; }
input, textarea { font: inherit; } #url { width: 65%; } textarea { width: 100%; }
article { white-space: pre-wrap; background: #eee; padding: 1em; margin: 1em 0; }
small { color: #555; } #status { white-space: pre-wrap; }
</style>
<h1>atto WebSocket client</h1>
<p><input id="url" value="ws://127.0.0.1:7878/ws" aria-label="WebSocket URL">
<input id="token" type="password" placeholder="Bearer token" aria-label="Bearer token">
<button id="connect">Connect</button></p>
<p><input id="thread" placeholder="Thread ID (empty starts one)">
<button id="open" disabled>Start / resume</button></p>
<div id="status">Disconnected</div>
<div id="items"></div>
<textarea id="input" placeholder="Message"></textarea>
<button id="send" disabled>Send</button><button id="steer" disabled>Steer</button>
<button id="interrupt" disabled>Interrupt</button><button id="detach" disabled>Detach</button>
<script>
const $ = id => document.getElementById(id);
let socket, seq = 0, threadId = '', cursor = 0, hydrating = false, backlog = [];
let pending = new Map(), items = new Map();
function status(text) { $('status').textContent = text; }
function controls(connected, attached = false) {
  $('open').disabled = !connected;
  for (const id of ['send', 'steer', 'interrupt', 'detach']) $(id).disabled = !attached;
}
function call(method, params = {}) {
  const id = ++seq;
  return new Promise((resolve, reject) => {
    pending.set(id, {resolve, reject});
    socket.send(JSON.stringify({id, method, params}));
  });
}
function render() {
  $('items').replaceChildren();
  for (const item of items.values()) {
    const element = document.createElement('article');
    const label = document.createElement('small');
    label.textContent = item.type + ' · ' + (item.status || '');
    const body = document.createElement('div');
    body.textContent = item.text || [item.description, item.command, item.output].filter(Boolean).join('\n');
    element.append(label, body); $('items').append(element);
  }
}
async function snapshot(method) {
  hydrating = true; backlog = [];
  try {
    const info = await call(method, threadId ? {threadId} : {});
    threadId = info.threadId; $('thread').value = threadId; cursor = info.eventId || 0;
    items = new Map((info.items || []).map(item => [item.id, item]));
    hydrating = false; const queued = backlog; backlog = [];
    for (const message of queued) event(message);
    render(); controls(true, true); status(info.busy ? 'Running' : 'Ready');
    if (info.prompt) await answerPrompt(info.prompt);
  } finally { hydrating = false; }
}
async function answerPrompt(prompt) {
  const options = prompt.options || [];
  const text = window.prompt(prompt.title + (options.length ? '\n' + options.map((x, i) => `${i + 1}. ${x.label}`).join('\n') : ''), prompt.text || '');
  const answer = {threadId, id: prompt.id};
  if (text === null) answer.cancel = true;
  else if (prompt.kind === 'select') {
    const index = Number(text) - 1;
    if (!Number.isInteger(index) || index < 0 || index >= options.length) answer.cancel = true;
    else answer.index = index;
  } else answer.text = text;
  try { await call('prompt/answer', answer); } catch (e) { status(e.message); }
}
function event(message) {
  if (hydrating) { backlog.push(message); return; }
  if (message.method === 'events/reset') { if (threadId) snapshot('thread/read').catch(showError); return; }
  const p = message.params || {};
  if (p.threadId !== threadId || (message.eventId && message.eventId <= cursor)) return;
  cursor = message.eventId || cursor;
  if (['item/started', 'item/updated', 'item/completed'].includes(message.method)) items.set(p.item.id, p.item);
  if (message.method === 'item/delta') {
    const item = items.get(p.itemId);
    if (item) { const field = item.type === 'commandExecution' ? 'output' : 'text'; item[field] = (item[field] || '') + p.delta; }
  }
  if (message.method === 'turn/started') status('Running');
  if (message.method === 'turn/completed') status(p.error || p.status);
  if (message.method === 'prompt/open') answerPrompt(p.prompt);
  if (message.method === 'thread/branchChanged') snapshot('thread/read').catch(showError);
  if (message.method === 'thread/closed') { controls(true); status('Thread closed'); }
  render();
}
function showError(e) { status(e.message); }
$('connect').onclick = () => {
  if (socket) socket.close();
  const address = new URL($('url').value);
  if ($('token').value) address.searchParams.set('token', $('token').value);
  const current = new WebSocket(address);
  socket = current; threadId = ''; items.clear(); render(); controls(false);
  current.onopen = async () => {
    if (socket !== current) return;
    try {
      await call('initialize', {protocolVersions: [2], clientInfo: {name: 'browser-example', version: '1'}, capabilities: {interactive: true}});
      current.send(JSON.stringify({method: 'initialized'})); controls(true); status('Connected: start or resume a thread');
    } catch (e) { showError(e); }
  };
  current.onmessage = ({data}) => {
    if (socket !== current) return;
    const message = JSON.parse(data);
    if ('id' in message) {
      const request = pending.get(message.id); pending.delete(message.id);
      if (request) message.error ? request.reject(new Error(message.error.message)) : request.resolve(message.result);
    } else event(message);
  };
  current.onclose = () => {
    if (socket !== current) return;
    for (const request of pending.values()) request.reject(new Error('Disconnected'));
    pending.clear(); controls(false); status('Disconnected (work in a worker continues)');
  };
  current.onerror = () => { if (socket === current) status('WebSocket failed: check URL, token and allowed Origin'); };
};
$('open').onclick = () => { threadId = $('thread').value.trim(); snapshot(threadId ? 'thread/resume' : 'thread/start').catch(showError); };
for (const [button, method] of [['send', 'turn/start'], ['steer', 'turn/steer']]) {
  $(button).onclick = async () => {
    try { await call(method, {threadId, input: $('input').value}); $('input').value = ''; }
    catch (e) { showError(e); }
  };
}
$('interrupt').onclick = () => call('turn/interrupt', {threadId, mode: 'cancel'}).catch(showError);
$('detach').onclick = () => socket.close(); // not thread/close
</script>
